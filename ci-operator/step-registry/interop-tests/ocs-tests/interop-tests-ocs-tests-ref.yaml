ref:
  as: interop-tests-ocs-tests
  best_effort: true
  from: ocs-ci-tests
  commands: interop-tests-ocs-tests-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 3h0m0s
  grace_period: 10m
  credentials:
    - collection: cnv-qe
      group: interop-tests-deploy
      mount_path: /tmp/secrets/odf-quay-credentials
    - collection: vsphere
      group: ibmcloud/ci
      mount_path: /var/run/vault/vsphere-ibmcloud-ci
  documentation: |-
    Run containerized OCS tests
  env:
  - name: ODF_VERSION_MAJOR_MINOR
    documentation: The ODF major.minor version
    default: "4.13"
  - name: MAP_TESTS
    default: "false"
    documentation: Specify whether to update the test suite name for reporting tools
  - name: LP_QE__CR__TS_NAME__PFX__ODF
    documentation: |-
      Component Readiness test-suite name prefix for ODF.
      Job must set this to match ci-test-mapping pattern.
      Example: "lp-interop--ODF--OPP" or "lp-ocp-compat--ODF"
  - name: DISABLE_ENVIRONMENT_CHECKER
    default: "false"
    documentation: If true, skip the OCS environment checker during teardown
