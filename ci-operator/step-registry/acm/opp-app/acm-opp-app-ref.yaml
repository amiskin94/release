ref:
  as: acm-opp-app
  from: cli-with-git
  commands: acm-opp-app-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  best_effort: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__ACM
    documentation: |-
      Component Readiness test-suite name prefix for ACM.
      Job must set this to match ci-test-mapping pattern.
      Example: "lp-interop--ACM--OPP" or "lp-interop--ACM--ACM+Virt"
  - name: MAP_TESTS
    default: "false"
    documentation: When true, remap junit test suite names for Component Readiness routing
  documentation: |-
    Deploys an application that influences and/or uses all components of the OPP bundle.
