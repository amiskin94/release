ref:
  as: gitops-operator-tests
  commands: gitops-operator-tests-commands.sh
  from: oc-bin-image
  timeout: 4h0m0s
  grace_period: 10m
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__GitOps
    documentation: |-
      Component Readiness test-suite name prefix for GitOps.
      Job must set this to match ci-test-mapping pattern.
      Example: "lp-interop--GitOps--OPP" or "lp-ocp-compat--GitOps"
  - name: MAP_TESTS
    default: "false"
    documentation: Specify whether to update the test suite name for reporting tools